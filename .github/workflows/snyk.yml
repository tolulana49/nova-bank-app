name: Nova Bank - Snyk Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Snyk CLI
        #run: npm i -g snyk@1.1308.4
        run: npm i -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth "$SNYK_TOKEN"

      - name: Snyk test - open source packages (block high and critical, fixable only)
        run: snyk test --severity-threshold=high --fail-on=upgradable

      - name: Snyk Code test - our own code (block high)
        if: always()
        run: snyk code test --severity-threshold=high --org=tolulana49

      - name: Snyk monitor (send to dashboard with ownership tags)
        if: always() && github.event_name != 'pull_request'
        run: >
          snyk monitor
          --project-name=payments-team/nova-mobile-api
          --project-business-criticality=critical
          --project-environment=backend,external
          --project-lifecycle=production
          --project-tags=team=payments,owner=payments-lead

      - name: Create HTML report
        if: always()
        continue-on-error: true
        run: |
          npm install -g snyk-to-html@3.7.11
          snyk test --json | snyk-to-html -o result.html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: result.html
